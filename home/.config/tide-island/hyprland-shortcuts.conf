# Generated by Tide Island. Edit shortcuts in the Tide Island config app.
# These binds call Quickshell IPC; the same commands can be reused in scripts.
# Island command: island toggle.
bind = SUPER, TAB, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/tide-island-dotfiles call overview toggle
bind = SUPER, left, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/tide-island-dotfiles call tide showCustom
bind = SUPER, down, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/tide-island-dotfiles call tide showClock
bind = SUPER, page_down, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/tide-island-dotfiles call tide toggleWallpaperPicker
bind = SUPER, R, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/tide-island-dotfiles call tide toggleLauncher
bind = SUPER SHIFT, T, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/tide-island-dotfiles call tide toggleThemeSwitcher
