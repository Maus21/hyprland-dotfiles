# --- Window Styling & Opacity ---
allow_remote_control yes
confirm_os_window_close -1
background_opacity      0.8
dynamic_background_opacity yes
hide_window_decorations  no
initial_window_width    100c
initial_window_height   30c
remember_window_size    no

# --- Font Configuration ---
# 'monospace' defaults to your system's primary terminal font
# font_family      monospace
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        12.0

# --- Mouse & Cursor Settings ---
cursor_shape          beam
cursor_blink_interval 0
detect_urls           yes

# --- Primary Colors (Your Catppuccin Base) ---
background            #1e1e2e
foreground            #cdd6f4
selection_background  #cdd6f4
selection_foreground  #1e1e2e

# --- Cursor Colors ---
cursor                #f5e0dc
cursor_text_color     #1e1e2e

# --- Normal Colors (Your Nord Palette) ---
color0                #3B4252
color1                #BF616A
color2                #A3BE8C
color3                #EBCB8B
color4                #81A1C1
color5                #B48EAD
color6                #88C0D0
color7                #E5E9F0

# --- Bright Colors ---
color8                #4C566A
color9                #BF616A
color10               #A3BE8C
color11               #EBCB8B
color12               #81A1C1
color13               #B48EAD
color14               #89BCBB
color15               #ECEFF4

# --- Keybindings (Matching your Control+Shift preferences) ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mode --exact --tac
map ctrl+0       change_font_size all 0

# --- Smooth Cursor & Trail Animations ---
# Set the total number of frames or "trail segments" to track behind movement
cursor_trail 3

# Control the decay envelope timing (min decay in seconds, max decay in seconds)
# Lower values fade faster to reduce distracting ghosting
cursor_trail_decay 0.05 0.15

# Minimum distance (in character cells) the cursor must jump to trigger the trail
# Setting this to 0 means regular character typing will feel completely smooth
cursor_trail_start_threshold 0




# BEGIN_KITTY_FONTS
font_family      family="Adwaita Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

include theme-current.conf
